<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Production CRM · Real Achiever</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=2" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <span class="brand-mark__name">Real Achiever</span>
        <span class="brand-mark__attr">by Brand Bonjour</span>
      </div>
    </div>

    <nav class="nav">
      <a href="#/goals" class="nav__item nav__item--featured" data-route="goals">
        <span class="nav__icon" aria-hidden="true"></span>
        <span>Goals &amp; Predictions</span>
        <span class="nav__featured-badge">★</span>
      </a>
      <a href="#/dashboard" class="nav__item" data-route="dashboard">
        <span class="nav__icon" aria-hidden="true"></span>
        <span>Dashboard</span>
      </a>
      <a href="#/deals" class="nav__item" data-route="deals">
        <span class="nav__icon" aria-hidden="true"></span>
        <span>Deals</span>
      </a>
      <a href="#/agents" class="nav__item" data-route="agents">
        <span class="nav__icon" aria-hidden="true"></span>
        <span>Realtor Database</span>
      </a>
      <a href="#/expenses" class="nav__item" data-route="expenses">
        <span class="nav__icon" aria-hidden="true"></span>
        <span>Client Expenses</span>
      </a>
      <a href="#/underwriters" class="nav__item" data-route="underwriters">
        <span class="nav__icon" aria-hidden="true"></span>
        <span>Underwriters</span>
      </a>
      <a href="#/monthly" class="nav__item" data-route="monthly">
        <span class="nav__icon" aria-hidden="true"></span>
        <span>Monthly Production</span>
      </a>
      <a href="#/data" class="nav__item" data-route="data">
        <span class="nav__icon" aria-hidden="true"></span>
        <span>Data &amp; Backup</span>
      </a>
    </nav>

    <div class="sidebar__foot">
      <div class="sidebar__foot-label">Production Sheet</div>
      <div class="sidebar__foot-value">2025 — 2026</div>
    </div>
  </aside>

  <main class="main" id="main">
    <!-- Views render here -->
  </main>

  <!-- Global footer -->
  <footer class="app-footer" role="contentinfo">
    <a href="https://brandbonjour.com" target="_blank" rel="noopener" class="app-footer__link" aria-label="Powered by Brand Bonjour">
      <span class="app-footer__label">Powered by</span>
      <svg class="app-footer__logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="bbGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1A3C34" />
            <stop offset="55%" stop-color="#0F2922" />
            <stop offset="100%" stop-color="#081912" />
          </linearGradient>
        </defs>
        <rect x="1" y="1" width="46" height="46" rx="11" ry="11" fill="url(#bbGrad)" />
        <rect x="1" y="1" width="46" height="46" rx="11" ry="11" fill="none" stroke="#F8F4EF" stroke-opacity="0.35" stroke-width="0.75" />
        <!-- BO monogram -->
        <g fill="#F8F4EF" font-family="Cormorant Garamond, Georgia, serif" font-weight="400">
          <text x="13" y="32" font-size="22" text-anchor="middle" letter-spacing="-1">B</text>
          <text x="31" y="32" font-size="22" text-anchor="middle" letter-spacing="-1">O</text>
        </g>
        <circle cx="24" cy="40" r="0.9" fill="#F8F4EF" />
      </svg>
      <span class="app-footer__wordmark">Brand Bonjour</span>
    </a>
  </footer>

  <!-- Modal shell -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__card" role="dialog" aria-modal="true">
      <button class="modal__close" data-close-modal aria-label="Close">×</button>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/seed.js?v=2"></script>
  <script src="js/data.js?v=2"></script>
  <script src="js/import.js?v=2"></script>
  <script src="js/views.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
