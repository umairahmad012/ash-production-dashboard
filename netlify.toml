[build]
  # Static site — nothing to build. Netlify serves files from the publish dir as-is.
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = true

# Short cache so deploys propagate quickly. Bump ?v= in index.html to force-bust if needed.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

# Basic security headers for a browser-only app
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
